name: PR Checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Syntax
        run: |
          node --check lib/index.js
          node --check lib/claude-code.js

      # `test/credential.test.mjs` needs a real Claude Code credential and edits
      # the macOS keychain, so it cannot run here; `test/plugin.test.mjs` covers
      # the same logic against stubs instead.
      - name: Test
        run: node test/plugin.test.mjs

      - name: Validate package contents
        run: npm pack --dry-run --ignore-scripts